<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="420" fill="#f8f9fa" rx="16"/>
  <text x="40" y="45" font-size="22" font-weight="700" fill="#1a1a2e">商品图白底拍摄布光方案</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Product Photography Lighting Setup for White Background</text>
  <!-- Top view diagram -->
  <text x="40" y="100" font-size="13" font-weight="700" fill="#1a1a2e">俯视图 (Top View)</text>
  <!-- Backdrop -->
  <rect x="250" y="115" width="300" height="12" fill="#d1d5db" rx="3"/>
  <text x="400" y="106" font-size="10" fill="#6b7280" text-anchor="middle">背景板/白墙</text>
  <!-- Product -->
  <circle cx="400" cy="170" r="20" fill="#4361ee" opacity="0.15"/>
  <circle cx="400" cy="170" r="20" fill="none" stroke="#4361ee" stroke-width="1.5"/>
  <text x="400" y="205" font-size="11" fill="#4361ee" font-weight="600" text-anchor="middle">商品</text>
  <!-- Lights -->
  <rect x="260" y="135" width="24" height="16" fill="#f59e0b" rx="4"/>
  <text x="272" y="145" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">💡</text>
  <text x="260" y="125" font-size="9" fill="#f59e0b" text-anchor="middle">主光源 L</text>
  <rect x="516" y="135" width="24" height="16" fill="#f59e0b" rx="4"/>
  <text x="528" y="145" font-size="9" fill="#fff" font-weight="700" text-anchor="middle">💡</text>
  <text x="516" y="125" font-size="9" fill="#f59e0b" text-anchor="middle">主光源 R</text>
  <!-- Camera -->
  <rect x="390" y="230" width="20" height="14" fill="#374151" rx="3"/>
  <text x="400" y="255" font-size="10" fill="#374151" text-anchor="middle">📷 相机</text>
  <!-- Side view -->
  <text x="40" y="285" font-size="13" font-weight="700" fill="#1a1a2e">侧视图 (Side View)</text>
  <!-- Backdrop -->
  <rect x="180" y="355" width="140" height="10" fill="#d1d5db" rx="2"/>
  <!-- Floor -->
  <rect x="100" y="365" width="300" height="6" fill="#e5e7eb" rx="2"/>
  <!-- Light left -->
  <rect x="160" y="310" width="16" height="12" fill="#f59e0b" rx="3"/>
  <line x1="168" y1="322" x2="250" y2="362" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4 2" opacity="0.5"/>
  <!-- Product -->
  <ellipse cx="250" cy="362" rx="12" ry="8" fill="#4361ee" opacity="0.15"/>
  <ellipse cx="250" cy="362" rx="12" ry="8" fill="none" stroke="#4361ee" stroke-width="1.5"/>
  <!-- Reflection board -->
  <rect x="290" y="330" width="10" height="30" fill="#e5e7eb" rx="2"/>
  <text x="295" y="320" font-size="9" fill="#6b7280" text-anchor="middle">反光板</text>
  <!-- Tips -->
  <text x="450" y="135" font-size="15" font-weight="700" fill="#1a1a2e">💡 拍摄要点</text>
  <rect x="450" y="150" width="12" height="12" fill="#4361ee" rx="3"/>
  <text x="470" y="161" font-size="11" fill="#374151">使用纯白背景（白纸/白墙/摄影布）</text>
  <rect x="450" y="172" width="12" height="12" fill="#4361ee" rx="3"/>
  <text x="470" y="183" font-size="11" fill="#374151">双灯 45° 打光消除阴影</text>
  <rect x="450" y="194" width="12" height="12" fill="#4361ee" rx="3"/>
  <text x="470" y="205" font-size="11" fill="#374151">反光板补光避免暗面过黑</text>
  <rect x="450" y="216" width="12" height="12" fill="#06d6a0" rx="3"/>
  <text x="470" y="227" font-size="11" fill="#374151">拍完后用 Zan Pic AI抠图一键去背景，效果更精准</text>
  <text x="40" y="410" font-size="10" fill="#9ca3af">即使没有专业设备，也可以用 Zan Pic 的 AI 抠图功能自动生成纯白底商品图</text>
</svg>