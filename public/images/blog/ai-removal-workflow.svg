<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="400" fill="#f8f9fa" rx="16"/>
  <text x="40" y="45" font-size="22" font-weight="700" fill="#1a1a2e">AI 智能抠图工作流程</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">AI Background Removal Pipeline</text>
  <!-- Step 1 -->
  <rect x="40" y="95" width="140" height="100" fill="#4361ee" rx="12"/>
  <text x="110" y="135" font-size="36" fill="#fff" text-anchor="middle">📷</text>
  <text x="110" y="175" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">上传图片</text>
  <!-- Arrow 1 -->
  <text x="200" y="150" font-size="24" fill="#6b7280" text-anchor="middle">→</text>
  <!-- Step 2 -->
  <rect x="230" y="95" width="140" height="100" fill="#4361ee" rx="12"/>
  <text x="300" y="135" font-size="36" fill="#fff" text-anchor="middle">🧠</text>
  <text x="300" y="175" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">AI 识别前景</text>
  <!-- Arrow 2 -->
  <text x="390" y="150" font-size="24" fill="#6b7280" text-anchor="middle">→</text>
  <!-- Step 3 -->
  <rect x="420" y="95" width="140" height="100" fill="#4361ee" rx="12"/>
  <text x="490" y="135" font-size="36" fill="#fff" text-anchor="middle">✂️</text>
  <text x="490" y="175" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">分离背景</text>
  <!-- Arrow 3 -->
  <text x="580" y="150" font-size="24" fill="#6b7280" text-anchor="middle">→</text>
  <!-- Step 4 -->
  <rect x="610" y="95" width="150" height="100" fill="#06d6a0" rx="12"/>
  <text x="685" y="135" font-size="36" fill="#fff" text-anchor="middle">✅</text>
  <text x="685" y="175" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">导出透明图</text>
  <!-- Details -->
  <text x="40" y="240" font-size="15" font-weight="700" fill="#1a1a2e">核心技术栈</text>
  <rect x="40" y="255" width="345" height="60" fill="#fff" rx="8"/>
  <text x="60" y="280" font-size="13" fill="#374151" font-weight="600">IS-Net 深度学习模型</text>
  <text x="60" y="300" font-size="11" fill="#6b7280">高精度人像/物体分割，处理发丝级细节</text>
  <rect x="405" y="255" width="355" height="60" fill="#fff" rx="8"/>
  <text x="425" y="280" font-size="13" fill="#374151" font-weight="600">WebGPU 硬件加速</text>
  <text x="425" y="300" font-size="11" fill="#6b7280">利用 GPU 加速推理，抠图仅需 2-5 秒</text>
  <!-- Edge refinement -->
  <text x="40" y="355" font-size="15" font-weight="700" fill="#1a1a2e">后处理：边缘精修 (maskRefine)</text>
  <rect x="40" y="368" width="720" height="25" fill="#f0f2ff" rx="6"/>
  <text x="160" y="385" font-size="11" fill="#4361ee" text-anchor="middle">形态学去噪</text>
  <text x="310" y="385" font-size="11" fill="#8b5cf6" text-anchor="middle">→ 高斯羽化</text>
  <text x="440" y="385" font-size="11" fill="#06d6a0" text-anchor="middle">→ 对比度锐化</text>
  <text x="570" y="385" font-size="11" fill="#f59e0b" text-anchor="middle">→ 小噪点清理</text>
  <text x="700" y="385" font-size="11" fill="#ef4444" text-anchor="middle">→ 最终输出</text>
</svg>