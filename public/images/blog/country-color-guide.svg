<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="400" fill="#f8f9fa" rx="16"/>
  <text x="40" y="45" font-size="22" font-weight="700" fill="#1a1a2e">各国证件照背景色要求指南</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">International ID Photo Background Color Guide</text>
  <!-- Table -->
  <rect x="40" y="90" width="720" height="34" fill="#4361ee" rx="6"/>
  <text x="60" y="112" font-size="12" fill="#fff" font-weight="600">国家/地区</text>
  <text x="200" y="112" font-size="12" fill="#fff" font-weight="600">背景要求</text>
  <text x="380" y="112" font-size="12" fill="#fff" font-weight="600">特殊要求</text>
  <!-- China -->
  <rect x="40" y="126" width="720" height="28" fill="#fff"/>
  <rect x="60" y="132" width="16" height="16" fill="#438EDB" rx="3"/>
  <text x="85" y="146" font-size="12" fill="#1a1a2e" font-weight="600">中国</text>
  <text x="200" y="146" font-size="12" fill="#374151">白/蓝/红</text>
  <text x="380" y="146" font-size="12" fill="#6b7280">身份证白色，护照蓝色或白色</text>
  <!-- USA -->
  <rect x="40" y="156" width="720" height="28" fill="#f0f2ff"/>
  <rect x="60" y="162" width="16" height="16" fill="#FFFFFF" stroke="#d1d5db" stroke-width="0.5" rx="3"/>
  <text x="85" y="176" font-size="12" fill="#1a1a2e" font-weight="600">美国</text>
  <text x="200" y="176" font-size="12" fill="#374151">白色或灰白色</text>
  <text x="380" y="176" font-size="12" fill="#6b7280">纯白背景，无阴影，无纹理</text>
  <!-- UK -->
  <rect x="40" y="186" width="720" height="28" fill="#fff"/>
  <rect x="60" y="192" width="16" height="16" fill="#d4d4d8" rx="3"/>
  <text x="85" y="206" font-size="12" fill="#1a1a2e" font-weight="600">英国</text>
  <text x="200" y="206" font-size="12" fill="#374151">浅灰或奶油色</text>
  <text x="380" y="206" font-size="12" fill="#6b7280">纯浅色背景，非白色</text>
  <!-- Japan -->
  <rect x="40" y="216" width="720" height="28" fill="#f0f2ff"/>
  <rect x="60" y="222" width="16" height="16" fill="#FFFFFF" stroke="#d1d5db" stroke-width="0.5" rx="3"/>
  <text x="85" y="236" font-size="12" fill="#1a1a2e" font-weight="600">日本</text>
  <text x="200" y="236" font-size="12" fill="#374151">白色</text>
  <text x="380" y="236" font-size="12" fill="#6b7280">纯白色背景，无反光</text>
  <!-- Schengen -->
  <rect x="40" y="246" width="720" height="28" fill="#fff"/>
  <rect x="60" y="252" width="16" height="16" fill="#f0f0f0" stroke="#d1d5db" stroke-width="0.5" rx="3"/>
  <text x="85" y="266" font-size="12" fill="#1a1a2e" font-weight="600">申根国家</text>
  <text x="200" y="266" font-size="12" fill="#374151">浅色（无规定）</text>
  <text x="380" y="266" font-size="12" fill="#6b7280">各国要求不同，建议白色</text>
  <!-- Summary -->
  <text x="40" y="315" font-size="15" font-weight="700" fill="#1a1a2e">🎨 Zan Pic 支持的颜色</text>
  <rect x="40" y="330" width="120" height="55" fill="#D9001B" rx="8"/>
  <text x="100" y="355" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">红色</text>
  <text x="100" y="374" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">#D9001B</text>
  <rect x="180" y="330" width="120" height="55" fill="#FFFFFF" stroke="#d1d5db" stroke-width="1" rx="8"/>
  <text x="240" y="355" font-size="12" fill="#1a1a2e" font-weight="600" text-anchor="middle">白色</text>
  <text x="240" y="374" font-size="10" fill="#6b7280" text-anchor="middle">#FFFFFF</text>
  <rect x="320" y="330" width="120" height="55" fill="#438EDB" rx="8"/>
  <text x="380" y="355" font-size="12" fill="#fff" font-weight="600" text-anchor="middle">蓝色</text>
  <text x="380" y="374" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">#438EDB</text>
  <text x="400" y="395" font-size="10" fill="#9ca3af" text-anchor="middle">支持自定义颜色，满足各国特殊要求</text>
</svg>