<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="400" fill="#f8f9fa" rx="16"/>
  <text x="40" y="45" font-size="22" font-weight="700" fill="#1a1a2e">WebGPU vs WebGL 性能对比</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">AI Inference Performance Comparison (onnxruntime-web)</text>
  <!-- Bar chart -->
  <!-- WebGPU bar -->
  <text x="80" y="380" font-size="11" fill="#1a1a2e" font-weight="600">WebGPU</text>
  <rect x="50" y="280" width="60" height="90" fill="#4361ee" rx="4"/>
  <rect x="55" y="285" width="50" height="85" fill="#4361ee" opacity="0.3" rx="3"/>
  <text x="80" y="272" font-size="14" fill="#4361ee" font-weight="700" text-anchor="middle">~2.5s</text>
  <!-- WebGL bar -->
  <text x="200" y="380" font-size="11" fill="#1a1a2e" font-weight="600">WebGL</text>
  <rect x="170" y="240" width="60" height="130" fill="#f59e0b" rx="4"/>
  <rect x="175" y="245" width="50" height="125" fill="#f59e0b" opacity="0.3" rx="3"/>
  <text x="200" y="232" font-size="14" fill="#f59e0b" font-weight="700" text-anchor="middle">~5.2s</text>
  <!-- WASM bar -->
  <text x="320" y="380" font-size="11" fill="#1a1a2e" font-weight="600">WASM</text>
  <rect x="290" y="190" width="60" height="180" fill="#ef4444" rx="4"/>
  <rect x="295" y="195" width="50" height="175" fill="#ef4444" opacity="0.3" rx="3"/>
  <text x="320" y="182" font-size="14" fill="#ef4444" font-weight="700" text-anchor="middle">~12.8s</text>
  <!-- Y-axis labels -->
  <text x="402" y="370" font-size="10" fill="#6b7280">0s</text>
  <line x1="405" y1="365" x2="780" y2="365" stroke="#e5e7eb" stroke-width="1"/>
  <text x="402" y="310" font-size="10" fill="#6b7280">6s</text>
  <line x1="405" y1="305" x2="780" y2="305" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="402" y="250" font-size="10" fill="#6b7280">12s</text>
  <line x1="405" y1="245" x2="780" y2="245" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Key features -->
  <text x="420" y="135" font-size="15" font-weight="700" fill="#1a1a2e">WebGPU 关键优势</text>
  <rect x="420" y="150" width="14" height="14" fill="#06d6a0" rx="3"/>
  <text x="444" y="162" font-size="12" fill="#374151">独立计算管线 — Compute Shader 原生支持</text>
  <rect x="420" y="175" width="14" height="14" fill="#06d6a0" rx="3"/>
  <text x="444" y="187" font-size="12" fill="#374151">更低驱动开销 — 直接操作 GPU 缓冲区</text>
  <rect x="420" y="200" width="14" height="14" fill="#06d6a0" rx="3"/>
  <text x="444" y="212" font-size="12" fill="#374151">并行处理优化 — 高效执行推理 kernel</text>
  <rect x="420" y="225" width="14" height="14" fill="#f59e0b" rx="3"/>
  <text x="444" y="237" font-size="11" fill="#6b7280">⚠️ 兼容性: Chrome 113+, Edge 113+, Opera 99+</text>
  <!-- Browser support row -->
  <text x="40" y="395" font-size="10" fill="#9ca3af">Zan Pic 支持 WebGPU → WASM 自动降级，兼容所有浏览器</text>
</svg>