<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="350" fill="#f8f9fa" rx="16"/>
  <text x="40" y="45" font-size="22" font-weight="700" fill="#1a1a2e">WebGPU 浏览器兼容性矩阵</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Browser WebGPU Support — June 2026</text>
  <!-- Table -->
  <rect x="40" y="88" width="720" height="32" fill="#4361ee" rx="6"/>
  <text x="80" y="109" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">浏览器</text>
  <text x="200" y="109" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">WebGPU 支持</text>
  <text x="330" y="109" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">最低版本</text>
  <text x="460" y="109" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">市场占比</text>
  <text x="590" y="109" font-size="11" fill="#fff" font-weight="600" text-anchor="middle">Zan Pic 策略</text>
  <!-- Chrome -->
  <rect x="40" y="122" width="720" height="28" fill="#fff"/>
  <text x="80" y="141" font-size="11" fill="#1a1a2e" font-weight="600" text-anchor="middle">Chrome</text>
  <rect x="170" y="130" width="60" height="16" fill="#06d6a0" rx="8"/>
  <text x="200" y="142" font-size="9" fill="#fff" font-weight="600" text-anchor="middle">✅ 支持</text>
  <text x="330" y="141" font-size="11" fill="#374151" text-anchor="middle">Chrome 113+</text>
  <text x="460" y="141" font-size="11" fill="#374151" text-anchor="middle">~65%</text>
  <text x="590" y="141" font-size="11" fill="#4361ee" text-anchor="middle">WebGPU 最高性能</text>
  <!-- Edge -->
  <rect x="40" y="152" width="720" height="28" fill="#f0f2ff"/>
  <text x="80" y="171" font-size="11" fill="#1a1a2e" font-weight="600" text-anchor="middle">Edge</text>
  <rect x="170" y="160" width="60" height="16" fill="#06d6a0" rx="8"/>
  <text x="200" y="172" font-size="9" fill="#fff" font-weight="600" text-anchor="middle">✅ 支持</text>
  <text x="330" y="171" font-size="11" fill="#374151" text-anchor="middle">Edge 113+</text>
  <text x="460" y="171" font-size="11" fill="#374151" text-anchor="middle">~12%</text>
  <text x="590" y="171" font-size="11" fill="#4361ee" text-anchor="middle">WebGPU 高性能</text>
  <!-- Opera -->
  <rect x="40" y="182" width="720" height="28" fill="#fff"/>
  <text x="80" y="201" font-size="11" fill="#1a1a2e" font-weight="600" text-anchor="middle">Opera</text>
  <rect x="170" y="190" width="60" height="16" fill="#f59e0b" rx="8"/>
  <text x="200" y="202" font-size="9" fill="#fff" font-weight="600" text-anchor="middle">✅ 部分</text>
  <text x="330" y="201" font-size="11" fill="#374151" text-anchor="middle">Opera 99+</text>
  <text x="460" y="201" font-size="11" fill="#374151" text-anchor="middle">~3%</text>
  <text x="590" y="201" font-size="11" fill="#4361ee" text-anchor="middle">WebGPU 可用</text>
  <!-- Firefox -->
  <rect x="40" y="212" width="720" height="28" fill="#f0f2ff"/>
  <text x="80" y="231" font-size="11" fill="#1a1a2e" font-weight="600" text-anchor="middle">Firefox</text>
  <rect x="170" y="220" width="60" height="16" fill="#ef4444" rx="8"/>
  <text x="200" y="232" font-size="9" fill="#fff" font-weight="600" text-anchor="middle">❌ 不支持</text>
  <text x="330" y="231" font-size="11" fill="#6b7280" text-anchor="middle">Nightly 试用中</text>
  <text x="460" y="231" font-size="11" fill="#374151" text-anchor="middle">~7%</text>
  <text x="590" y="231" font-size="11" fill="#374151" text-anchor="middle">WASM 降级</text>
  <!-- Safari -->
  <rect x="40" y="242" width="720" height="28" fill="#fff"/>
  <text x="80" y="261" font-size="11" fill="#1a1a2e" font-weight="600" text-anchor="middle">Safari</text>
  <rect x="170" y="250" width="60" height="16" fill="#f59e0b" rx="8"/>
  <text x="200" y="262" font-size="9" fill="#fff" font-weight="600" text-anchor="middle">🔄 实验</text>
  <text x="330" y="261" font-size="11" fill="#6b7280" text-anchor="middle">Safari TP</text>
  <text x="460" y="261" font-size="11" fill="#374151" text-anchor="middle">~12%</text>
  <text x="590" y="261" font-size="11" fill="#374151" text-anchor="middle">WASM 降级</text>
  <!-- Strategy -->
  <text x="40" y="310" font-size="14" font-weight="700" fill="#1a1a2e">🛡️ Zan Pic 降级策略</text>
  <rect x="40" y="320" width="720" height="22" rx="6"/>
  <text x="400" y="336" font-size="11" fill="#4361ee" text-anchor="middle">WebGPU 优先 → 失败自动切换 WebGL → 最后回退 WASM（CPU），确保所有浏览器可用</text>
</svg>