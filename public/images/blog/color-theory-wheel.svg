<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="400" fill="#f8f9fa" rx="16"/>
  <text x="40" y="45" font-size="22" font-weight="700" fill="#1a1a2e">基础色彩理论 — 色轮</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Color Theory — Understanding Tone & Mood</text>
  <!-- Color wheel circles -->
  <circle cx="220" cy="180" r="80" fill="#ef4444" opacity="0.8"/>
  <circle cx="290" cy="160" r="80" fill="#f59e0b" opacity="0.8"/>
  <circle cx="300" cy="220" r="80" fill="#10b981" opacity="0.8"/>
  <circle cx="230" cy="240" r="80" fill="#3b82f6" opacity="0.8"/>
  <circle cx="175" cy="210" r="80" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="260" cy="190" r="50" fill="#f8f9fa"/>
  <text x="260" y="185" font-size="11" fill="#1a1a2e" font-weight="600" text-anchor="middle">色轮</text>
  <text x="260" y="200" font-size="10" fill="#6b7280" text-anchor="middle">Color Wheel</text>
  <!-- Descriptions -->
  <text x="450" y="140" font-size="15" font-weight="700" fill="#1a1a2e">色调对情绪的影响</text>
  <rect x="450" y="155" width="12" height="12" fill="#ef4444" rx="2"/>
  <text x="472" y="166" font-size="12" fill="#374151">暖色系（红/橙/黄）：活力、温暖、热情</text>
  <rect x="450" y="180" width="12" height="12" fill="#3b82f6" rx="2"/>
  <text x="472" y="191" font-size="12" fill="#374151">冷色系（蓝/青/紫）：冷静、专业、沉静</text>
  <rect x="450" y="205" width="12" height="12" fill="#10b981" rx="2"/>
  <text x="472" y="216" font-size="12" fill="#374151">中性色（绿）：自然、平衡、和谐</text>
  <!-- Warm vs Cool comparison boxes -->
  <text x="40" y="330" font-size="15" font-weight="700" fill="#1a1a2e">冷暖色调效果对比</text>
  <rect x="40" y="345" width="160" height="40" fill="#f97316" rx="8" opacity="0.15"/>
  <rect x="42" y="347" width="156" height="36" fill="none" stroke="#f97316" stroke-width="1.5" rx="7"/>
  <text x="120" y="370" font-size="13" fill="#f97316" font-weight="600" text-anchor="middle">🌅 暖色调 → 温馨复古</text>
  <rect x="230" y="345" width="160" height="40" fill="#3b82f6" rx="8" opacity="0.15"/>
  <rect x="232" y="347" width="156" height="36" fill="none" stroke="#3b82f6" stroke-width="1.5" rx="7"/>
  <text x="310" y="370" font-size="13" fill="#3b82f6" font-weight="600" text-anchor="middle">❄️ 冷色调 → 清新现代</text>
  <text x="400" y="390" font-size="10" fill="#9ca3af" text-anchor="middle">Zan Pic 提供 8 种预设滤镜，支持自定义色彩调整</text>
</svg>