<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="400" fill="#f8f9fa" rx="16"/>
  <text x="40" y="45" font-size="22" font-weight="700" fill="#1a1a2e">证件照智能裁剪流程</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Zan Pic Smart ID Photo Crop Pipeline</text>
  <!-- Step boxes -->
  <rect x="40" y="95" width="140" height="110" fill="#4361ee" rx="12"/>
  <text x="110" y="135" font-size="42" fill="#fff" text-anchor="middle">📷</text>
  <text x="110" y="165" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Step 1</text>
  <text x="110" y="190" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">AI 抠图</text>
  <text x="195" y="155" font-size="20" fill="#4361ee" text-anchor="middle">→</text>
  <rect x="215" y="95" width="140" height="110" fill="#8b5cf6" rx="12"/>
  <text x="285" y="135" font-size="42" fill="#fff" text-anchor="middle">📐</text>
  <text x="285" y="165" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Step 2</text>
  <text x="285" y="190" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">人脸定位</text>
  <text x="370" y="155" font-size="20" fill="#8b5cf6" text-anchor="middle">→</text>
  <rect x="390" y="95" width="140" height="110" fill="#06d6a0" rx="12"/>
  <text x="460" y="135" font-size="42" fill="#fff" text-anchor="middle">✂️</text>
  <text x="460" y="165" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Step 3</text>
  <text x="460" y="190" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">智能裁剪</text>
  <text x="545" y="155" font-size="20" fill="#06d6a0" text-anchor="middle">→</text>
  <rect x="565" y="95" width="170" height="110" fill="#f59e0b" rx="12"/>
  <text x="650" y="135" font-size="42" fill="#fff" text-anchor="middle">🎨</text>
  <text x="650" y="165" font-size="12" fill="#fff" font-weight="700" text-anchor="middle">Step 4</text>
  <text x="650" y="190" font-size="11" fill="rgba(255,255,255,0.8)" text-anchor="middle">背景替换 & 导出</text>
  <!-- Details -->
  <text x="40" y="245" font-size="15" font-weight="700" fill="#1a1a2e">智能裁剪算法关键参数</text>
  <rect x="40" y="260" width="345" height="60" fill="#fff" rx="8"/>
  <text x="60" y="282" font-size="12" fill="#374151">🖼️ 构图标准：脸部中心位于照片 45% 高度</text>
  <text x="60" y="302" font-size="11" fill="#6b7280">符合 ISO 19794-5 证件照国际标准</text>
  <rect x="405" y="260" width="355" height="60" fill="#fff" rx="8"/>
  <text x="425" y="282" font-size="12" fill="#374151">🛡️ 安全边距：不截头顶 10%，不截肩膀 12%</text>
  <text x="425" y="302" font-size="11" fill="#6b7280">自动 Padding — 人像距边缘不足时补充空间</text>
  <!-- Output sizes -->
  <text x="40" y="355" font-size="15" font-weight="700" fill="#1a1a2e">支持输出规格</text>
  <rect x="40" y="368" width="130" height="25" fill="#e8ecff" rx="6"/>
  <text x="105" y="385" font-size="11" fill="#4361ee" font-weight="600" text-anchor="middle">一寸 295×413</text>
  <rect x="185" y="368" width="130" height="25" fill="#e8ecff" rx="6"/>
  <text x="250" y="385" font-size="11" fill="#4361ee" font-weight="600" text-anchor="middle">二寸 413×579</text>
  <rect x="330" y="368" width="130" height="25" fill="#e8ecff" rx="6"/>
  <text x="395" y="385" font-size="11" fill="#4361ee" font-weight="600" text-anchor="middle">小二寸 413×531</text>
  <rect x="475" y="368" width="160" height="25" fill="#e8ecff" rx="6"/>
  <text x="555" y="385" font-size="11" fill="#4361ee" font-weight="600" text-anchor="middle">6寸冲印 1200×1800</text>
</svg>