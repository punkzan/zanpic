<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui,-apple-system,sans-serif">
  <rect width="800" height="400" fill="#f8f9fa" rx="16"/>
  <text x="40" y="45" font-size="22" font-weight="700" fill="#1a1a2e">证件照换底色 — 三种标准背景色</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">ID Photo Background Color Reference</text>
  <!-- Red -->
  <rect x="40" y="95" width="220" height="220" fill="#D9001B" rx="12"/>
  <text x="150" y="220" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">红色背景</text>
  <text x="150" y="245" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">#D9001B</text>
  <text x="150" y="300" font-size="11" fill="#374151" text-anchor="middle">护照、签证、毕业照</text>
  <!-- White -->
  <rect x="290" y="95" width="220" height="220" fill="#FFFFFF" stroke="#d1d5db" stroke-width="1" rx="12"/>
  <text x="400" y="220" font-size="16" fill="#1a1a2e" font-weight="700" text-anchor="middle">白色背景</text>
  <text x="400" y="245" font-size="12" fill="#6b7280" text-anchor="middle">#FFFFFF</text>
  <text x="400" y="300" font-size="11" fill="#374151" text-anchor="middle">身份证、驾驶证、社保卡</text>
  <!-- Blue -->
  <rect x="540" y="95" width="220" height="220" fill="#438EDB" rx="12"/>
  <text x="650" y="220" font-size="16" fill="#fff" font-weight="700" text-anchor="middle">蓝色背景</text>
  <text x="650" y="245" font-size="12" fill="rgba(255,255,255,0.8)" text-anchor="middle">#438EDB</text>
  <text x="650" y="300" font-size="11" fill="#374151" text-anchor="middle">毕业证、学历证、工作证</text>
  <!-- Add info line -->
  <text x="400" y="370" font-size="10" fill="#9ca3af" text-anchor="middle">Zan Pic 支持一键切换红/白/蓝三种标准背景色</text>
</svg>