        <h2 style="font-size:20px;font-weight:600;margin-top:20px">Privacy by Design</h2>
        <p>Zan Pic is a 100% client-side application. All image editing, AI inference, and ID photo generation run locally in your browser via ONNX Runtime and WebGPU. We do not collect, store, or upload your images. The AI model downloads once from a CDN and is cached on your device — subsequent uses work fully offline.</p>

        <p><strong>Q: Does the AI background remover work on mobile?</strong><br />A: Yes. Modern mobile browsers (Chrome, Edge, Safari 17+) support WebGPU. The first use downloads the AI model (~24MB), then it's cached locally.</p>
